name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dbus-daemon
        run: sudo apt-get update && sudo apt-get install -y dbus
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # ジョブの Go（go.mod の版）でビルドさせる。ビルド済みバイナリの Go が古いと解析できないため
          install-mode: goinstall
      - name: golangci-lint (e2e build)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --build-tags e2e
      - name: Test
        run: |
          go test -race ./...
          go test -tags e2e ./...
      - name: Build (static, amd64/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null .
          GOOS=linux GOARCH=amd64 go build -trimpath -tags e2e -o /dev/null .
