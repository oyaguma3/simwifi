name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dbus-daemon
        run: sudo apt-get update && sudo apt-get install -y dbus
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Test
        run: |
          go test -race ./...
          go test -tags e2e ./...
      - name: Build (static, amd64/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null .
          GOOS=linux GOARCH=amd64 go build -trimpath -tags e2e -o /dev/null .
